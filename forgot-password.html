<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — GarrixCore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg-video-wrap">
  <video autoplay loop muted playsinline>
    <source src="https://videos.pexels.com/video-files/8128311/8128311-uhd_2560_1440_25fps.mp4" type="video/mp4">
  </video>
</div>
<div class="bg-overlay"></div>

<div class="auth-card">
  <a href="login.html" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Back to sign in
  </a>

  <a href="index.html" style="text-decoration:none;"><div class="brand-mark">GarrixCore</div></a>
  <h1 class="page-title">Forgot your password?</h1>
  <p class="page-subtext page-subtitle">Enter the email tied to your account and we'll send a reset link.</p>

  <div class="error-box" id="forgot-error"></div>
  <div class="success-box" id="forgot-success"></div>

  <form id="forgot-form" novalidate>
    <div class="input-group" style="margin-bottom: 26px;">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      <input type="email" id="forgot-email" name="email" placeholder="Email address" required>
    </div>
    <button type="submit" class="submit" id="forgot-submit">Send reset link</button>
  </form>
</div>

<footer class="site-footer">© 2026 TumoDev. All rights reserved.</footer>

<script src="ui.js"></script>
<script src="auth.js"></script>
</body>
</html>
