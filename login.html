<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — GarrixCore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg-video-wrap">
  <video autoplay loop muted playsinline>
    <source src="https://videos.pexels.com/video-files/8128311/8128311-uhd_2560_1440_25fps.mp4" type="video/mp4">
  </video>
</div>
<div class="bg-overlay"></div>

<div class="auth-card">
  <div class="brand">
    <h1>GarrixCore</h1>
    <p class="tagline">Your gaming universe awaits</p>
    <span class="hint">[Press Enter to join the adventure]</span>
    <div class="emojis"><span>⚔️</span><span>🎮</span><span>🏆</span></div>
  </div>

  <div class="error-box" id="signin-error"></div>

  <form id="signin-form" novalidate>
    <div class="input-group">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      <input type="email" id="signin-email" name="email" placeholder="Email address" required>
    </div>

    <div class="input-group">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input type="password" id="signin-password" name="password" placeholder="Password" class="has-toggle" required>
      <button type="button" class="toggle-visibility" data-target="signin-password" aria-label="Show password">
        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="icon-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
      </button>
    </div>

    <div class="row-between">
      <div class="remember">
        <div class="switch">
          <input type="checkbox" id="remember-me" name="remember">
          <label for="remember-me" class="track"></label>
        </div>
        <label for="remember-me">Remember me</label>
      </div>
      <a href="forgot-password.html">Forgot password?</a>
    </div>

    <button type="submit" class="submit" id="signin-submit">Enter GarrixCore</button>
  </form>

  <div class="divider"><span>quick access via</span></div>

  <div class="social-row">
    <button type="button" class="social-btn" aria-label="Continue with Chrome">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="21.17" x2="12" y1="8" y2="8"/><line x1="3.95" x2="8.54" y1="6.06" y2="14"/><line x1="10.88" x2="15.46" y1="21.94" y2="14"/></svg>
    </button>
    <button type="button" class="social-btn" aria-label="Continue with X">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </button>
    <button type="button" class="social-btn" aria-label="Continue with Steam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="6"/></svg>
    </button>
  </div>

  <p class="switch-line">Don't have an account? <a href="signup.html">Create Account</a></p>
</div>

<footer class="site-footer">© 2026 TumoDev. All rights reserved.</footer>

<script src="ui.js"></script>
<script src="auth.js"></script>
</body>
</html>
